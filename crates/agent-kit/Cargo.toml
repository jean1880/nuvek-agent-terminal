[package]
name = "agent-kit"
version = "1.0.0"
edition = "2021"
authors = ["Jean-Luc Desroches <jean1880@users.noreply.github.com>"]
license = "MIT"
repository = "https://github.com/jean1880/nuvek-agent-terminal"
description = "GTK-free git, checkpoint and session logic for agent-terminal"
publish = false

[dependencies]
agent-core = { path = "../agent-core" }
rusqlite = { version = "0.41", features = ["bundled", "backup"] }
serde = { workspace = true }
serde_json = { workspace = true }
toml = "=1.1.8"
tracing = { workspace = true }
rmcp = { workspace = true, features = ["client"] }
tokio = { workspace = true, features = ["rt", "time", "io-util", "net", "process", "sync", "macros"] }
libc = "0.2"
ureq = { version = "3.4.2", default-features = false, features = ["rustls", "json"] }
# Image attachments: decoders for the four accepted formats and the PNG/JPEG encoders, pure Rust.
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
base64 = "=0.23.1"
sha2 = { version = "=0.11.1", default-features = false }

[features]
# Hermetic git fixture helpers (`agent_kit::test_support`) for dependents' tests. Off by
# default; enable it only from `[dev-dependencies]`, never in a shipped build.
test-support = []

[dev-dependencies]
tempfile = "3"
